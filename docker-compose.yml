version: "3.9"

services:
  travelbin-db:
    image: postgres:16
    container_name: travelbin-postgres
    environment:
      POSTGRES_DB: travelbin
      POSTGRES_USER: travelbin
      POSTGRES_PASSWORD: travelbin
    volumes:
      - travelbin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelbin -d travelbin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - travelplatform-network
    
  travelbin-backend:
    build: ./Teyvat
    container_name: travelbin-backend
    depends_on:
      travelbin-db:
        condition: service_healthy
    ports:
      - "8280:8000"
    environment:
      POSTGRES_DB: travelbin
      POSTGRES_USER: travelbin
      POSTGRES_PASSWORD: travelbin
      POSTGRES_HOST: travelbin-db
      POSTGRES_PORT: 5432
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - travelplatform-network

  travelbin-frontend:
    build: ./travelbin-frontend
    container_name: travelbin-frontend
    depends_on:
      - travelbin-backend
    ports:
      - "3000:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./travelbin-frontend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - travelplatform-network

volumes:
  travelbin_pgdata:

networks:
  travelplatform-network:
    external: true