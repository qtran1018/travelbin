version: "3.9"

services:
  travelbin-db:
    image: postgres:16
    container_name: travelbin-postgres
    profiles: ["standalone"]
    environment:
      POSTGRES_DB: travelbin
      POSTGRES_USER: travelbin
      POSTGRES_PASSWORD: ${TRAVELBIN_DB_PASSWORD:-travelbin}
    ports:
      - "5433:5432"
    volumes:
      - travelbin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelbin -d travelbin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - travelplatform-network

  travelbin-backend:
    build: ./travelbin-backend
    container_name: travelbin-backend
    depends_on:
      travelbin-db:
        condition: service_healthy
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_DB: travelbin
      POSTGRES_USER: travelbin
      POSTGRES_PASSWORD: ${TRAVELBIN_DB_PASSWORD:-travelbin}
      DB_HOST: ${POSTGRES_HOST:-platform-postgres}
      DB_PORT: 5432
      SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY not set}
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,travelbin-backend,0.0.0.0,travelbin-api.quangntran.com
      KEYCLOAK_ISSUER: https://auth.quangntran.com/realms/travel-platform
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/travel-platform/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: https://travelbin.quangntran.com
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - travelplatform-network

  travelbin-frontend:
    build:
      context: ./travelbin-frontend
      args:
        VITE_API_URL: https://travelbin-api.quangntran.com
        VITE_KEYCLOAK_URL: https://auth.quangntran.com
    container_name: travelbin-frontend
    depends_on:
      - travelbin-backend
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - travelplatform-network

volumes:
  travelbin_pgdata:

networks:
  travelplatform-network:
    external: true
