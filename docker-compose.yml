version: "3.9"

services:
  travelbin-db:
    image: postgres:16
    container_name: travelbin-postgres
    profiles: ["standalone"]
    environment:
      POSTGRES_DB: travelbin
      POSTGRES_USER: travelbin
      POSTGRES_PASSWORD: travelbin
    ports:
      - "5433:5432"
    volumes:
      - travelbin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelbin -d travelbin"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - travelplatform-network

  travelbin-backend:
    build: ./travelbin-backend
    container_name: travelbin-backend
    depends_on:
      travelbin-db:
        condition: service_healthy
        required: false
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: travelbin
      POSTGRES_USER: travelbin
      POSTGRES_PASSWORD: travelbin
      DB_HOST: ${POSTGRES_HOST:-travelbin-db}
      DB_PORT: 5432
      SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-*ba^c%!mo3-k#_ev#9va4sgm2=uj4)-k793ddaiisiswougjcn}
      DEBUG: "False"
      KEYCLOAK_ISSUER: https://auth.quangntran.com/realms/travel-platform
      CORS_ALLOWED_ORIGINS: https://travelbin.quangntran.com
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - travelplatform-network

  travelbin-frontend:
    build: ./travelbin-frontend
    container_name: travelbin-frontend
    depends_on:
      - travelbin-backend
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - travelplatform-network

volumes:
  travelbin_pgdata:

networks:
  travelplatform-network:
    external: true
